name: Security - Supply Chain

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '31 3 * * 1'

permissions:
  contents: read

jobs:
  composer-audit:
    name: Composer advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Show PHP and Composer versions
        run: |
          php --version
          composer --version

      - name: Validate Composer manifest and lockfile
        run: composer validate --strict --no-check-publish

      - name: Audit locked Composer dependencies
        run: composer audit --locked --abandoned=fail --format=summary

  npm-audit:
    name: npm advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Verify exact npm lock installation
        run: npm ci --ignore-scripts

      - name: Audit npm lockfile
        run: npm audit --audit-level=high

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

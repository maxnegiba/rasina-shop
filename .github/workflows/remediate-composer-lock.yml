name: Temporary - Composer Lock Remediation

on:
  push:
    branches:
      - agent/supply-chain-hardening

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Set up PHP 8.4 and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
        env:
          fail-fast: true

      - name: Update only advisory-affected Composer packages
        run: composer update dompdf/dompdf guzzlehttp/guzzle league/commonmark --with-all-dependencies --no-install --no-scripts --no-interaction

      - name: Verify advisories are resolved
        run: composer audit --locked --abandoned=report

      - name: Show remediated versions
        run: |
          composer show --locked dompdf/dompdf
          composer show --locked guzzlehttp/guzzle
          composer show --locked league/commonmark

      - name: Commit lockfile and remove this temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/remediate-composer-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock .github/workflows/remediate-composer-lock.yml
          git diff --cached --check
          git commit -m 'Remediate vulnerable Composer dependencies'
          git push origin HEAD:agent/supply-chain-hardening

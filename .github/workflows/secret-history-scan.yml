name: Security - Secret History Scan

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks full-history scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout complete repository history
        # actions/checkout v6.0.2, pinned to the exact SHA observed on the hardened runner.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install and run event-aware Gitleaks scan
        # gitleaks-action v3.0.0, immutable release SHA.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

      - name: Force scan across all refs and historical commits
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_BIN="$(find /tmp -maxdepth 2 -type f -name gitleaks -perm -111 -print -quit)"
          if [ -z "$GITLEAKS_BIN" ]; then
            echo 'Gitleaks binary was not installed by the preceding action.' >&2
            exit 2
          fi

          "$GITLEAKS_BIN" git --redact --verbose --log-opts="--all" .

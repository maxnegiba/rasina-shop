name: Temporary - Update Cookie Consent Lockfile

on:
  push:
    branches:
      - feature/marketing-tracking-foundation
    paths:
      - composer.json
      - .github/workflows/update-cookie-consent-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feature/marketing-tracking-foundation

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Update only cookie consent dependency
        run: composer update statikbe/laravel-cookie-consent --with-dependencies --no-interaction --no-scripts

      - name: Validate Composer files
        run: composer validate --strict --no-check-publish

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- composer.lock; then
            echo "composer.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore: lock cookie consent dependency"
          git push origin HEAD:feature/marketing-tracking-foundation

name: Temporary - Validate Marketing Foundation

on:
  push:
    branches:
      - feature/marketing-tracking-foundation
    paths:
      - .github/workflows/validate-marketing-foundation.yml
      - composer.json
      - composer.lock
      - bootstrap/app.php
      - config/cookie-consent.php
      - lang/vendor/cookie-consent/**
      - resources/views/vendor/cookie-consent/**
      - resources/css/cookie-consent.css
      - resources/js/app.js
      - public/vendor/cookie-consent/**
      - tests/Feature/**
      - .env.example

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare local environment file
        run: cp .env.example .env

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare test application
        run: php artisan key:generate

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run Laravel tests
        run: php artisan test
